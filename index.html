<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Effixly | Premium Invoice Engine</title>
    <style>
        :root { 
            --primary: #1a3a5f; 
            --accent: #00d2ff; 
            --dark-bg: #0f172a; 
            --editor-card: #1e293b;
            --text-gray: #94a3b8;
        }
        
        body { font-family: 'Inter', 'Segoe UI', sans-serif; margin: 0; display: flex; background: #0f172a; height: 100vh; color: white; }
        
        /* --- PRO EDITOR SIDEBAR --- */
        #editor { 
            width: 420px; 
            background: var(--dark-bg); 
            padding: 30px; 
            overflow-y: auto; 
            box-sizing: border-box; 
            border-right: 1px solid #334155;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
        }
        
        .brand-logo { font-size: 24px; font-weight: 800; margin-bottom: 30px; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        .brand-logo span { color: white; }

        .form-section { background: var(--editor-card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .form-section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 0; color: var(--accent); margin-bottom: 15px; }
        
        label { display: block; font-size: 11px; font-weight: 600; color: var(--text-gray); margin-bottom: 6px; text-transform: uppercase; }
        input, textarea, select { 
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; 
            background: #0f172a; color: white; box-sizing: border-box; margin-bottom: 15px; font-size: 13px;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(0, 210, 255, 0.2); }
        
        .btn-generate { 
            width: 100%; padding: 16px; background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; 
            font-size: 15px; text-transform: uppercase; letter-spacing: 1px; transition: transform 0.2s;
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); }

        /* --- PREVIEW AREA --- */
        #preview-container { flex-grow: 1; display: flex; justify-content: center; padding: 40px; overflow-y: auto; background: #334155; }
        
        #invoice-paper { 
            width: 210mm; min-height: 297mm; background: white; padding: 25mm; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5); box-sizing: border-box; color: #1e293b;
            display: flex; flex-direction: column; position: relative;
        }
        
        /* --- INVOICE DESIGN --- */
        .inv-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 50px; }
        #display-logo { max-width: 180px; filter: grayscale(100%) contrast(150%); }
        .inv-type { text-align: right; }
        .inv-type h1 { margin: 0; font-size: 40px; font-weight: 900; color: var(--primary); letter-spacing: -1px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
        .address-box h3 { font-size: 12px; text-transform: uppercase; color: var(--text-gray); border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 12px; }
        .address-box p { margin: 0; font-size: 14px; line-height: 1.5; }

        table { width: 100%; border-collapse: collapse; margin: 30px 0; }
        th { background: #f8fafc; text-align: left; padding: 15px; font-size: 12px; text-transform: uppercase; color: var(--text-gray); border-bottom: 2px solid var(--primary); }
        td { padding: 20px 15px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        
        .total-box { margin-left: auto; width: 250px; margin-top: 20px; }
        .total-row { display: flex; justify-content: space-between; padding: 10px 0; font-weight: 700; font-size: 18px; color: var(--primary); border-top: 2px solid var(--primary); }

        .banking-details { background: #f8fafc; padding: 25px; border-radius: 12px; margin-top: auto; border-left: 5px solid var(--primary); }
        .bank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 13px; }
        .bank-item label { color: var(--text-gray); font-size: 10px; margin-bottom: 4px; }
        .bank-item span { font-weight: 700; color: var(--primary); }

        #out-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #f1f5f9; text-align: center; font-style: italic; font-size: 13px; color: var(--text-gray); }

        @media print {
            #editor { display: none; }
            #preview-container { padding: 0; background: white; }
            #invoice-paper { box-shadow: none; width: 100%; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>
<body>

    <div id="editor">
        <div class="brand-logo">⚡ EFFIXLY <span>INVOICER</span></div>
        
        <div class="form-section">
            <h2>Client Info</h2>
            <label>Company Name</label>
            <input type="text" id="in-client-name" value="AECORA IT GmbH" oninput="update()">
            <label>Address & VAT</label>
            <textarea id="in-client-details" rows="3" oninput="update()">IZ NÖ-Süd, Str. 2, Obj. M6/7
A-2355 Wr. Neudorf
VAT No.: ATU70795516</textarea>
        </div>

        <div class="form-section">
            <h2>Payment & Banking</h2>
            <label>Mode of Transfer</label>
            <input type="text" id="in-mode" value="Wise (Direct to Bank)" oninput="update()">
            <label>IBAN</label>
            <input type="text" id="in-iban" value="PK17UNIL0109000341908508" oninput="update()">
            <label>Swift Code</label>
            <input type="text" id="in-swift" value="UNILPKKA" oninput="update()">
            <label>Bank Address</label>
            <input type="text" id="in-bank-addr" value="UBL Main Branch, Faisalabad, Pakistan" oninput="update()">
        </div>

        <div class="form-section">
            <h2>Project Details</h2>
            <label>Description</label>
            <input type="text" id="in-project" value="Performance Bonus - Milestone 3" oninput="update()">
            <label>Amount (USD)</label>
            <input type="text" id="in-price" value="$500.00 USD" oninput="update()">
            <label>Deadline (Optional)</label>
            <input type="text" id="in-deadline" placeholder="e.g. May 05, 2026" oninput="update()">
        </div>

        <div class="form-section">
            <h2>Footer Presets</h2>
            <select id="footer-presets" onchange="applyPreset()">
                <option value="">-- Choose Footer --</option>
                <option value="Final source code and documentation will be released immediately upon payment confirmation.">Option 1: Release Policy</option>
                <option value="Thank you for your business and for recognizing our effort. We appreciate your partnership!">Option 2: Recognition</option>
            </select>
            <textarea id="in-footer-text" rows="2" oninput="update()">Thank you for your business and for recognizing our effort.</textarea>
        </div>

        <button class="btn-generate" onclick="window.print()">Download Invoice PDF</button>
    </div>

    <div id="preview-container">
        <div id="invoice-paper">
            <div class="inv-header">
                <img id="display-logo" src="https://via.placeholder.com/150x60?text=EFFIXLY" alt="Logo">
                <div class="inv-type">
                    <h1>INVOICE</h1>
                    <p style="margin:0; font-weight:700;">#EFF-2026-003</p>
                    <p style="margin:0; color:#94a3b8; font-size:12px;" id="out-date"></p>
                </div>
            </div>

            <div class="grid-2">
                <div class="address-box">
                    <h3>From</h3>
                    <p><strong>Saad Abdur Razzaq</strong></p>
                    <p style="color:var(--accent-blue); font-weight:700; font-size:12px;">CTO & COO, Effixly</p>
                    <p>Faisalabad, Pakistan</p>
                </div>
                <div class="address-box">
                    <h3>Bill To</h3>
                    <p><strong><span id="out-client-name"></span></strong></p>
                    <p id="out-client-details" style="white-space: pre-line;"></p>
                </div>
            </div>

            <div id="deadline-box" style="margin-bottom:20px; font-size:13px; display:none;">
                <span style="color:var(--text-gray); text-transform:uppercase; font-size:10px; font-weight:800;">Payment Deadline:</span>
                <span id="out-deadline" style="margin-left:10px; font-weight:700; color:#e11d48;"></span>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Service Description</th>
                        <th style="text-align: right;">Total Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="out-project-desc" style="font-weight:600;"></td>
                        <td id="out-price" style="text-align: right; font-weight:800;"></td>
                    </tr>
                </tbody>
            </table>

            <div class="total-box">
                <div class="total-row">
                    <span>Amount Due</span>
                    <span id="out-total"></span>
                </div>
            </div>

            <div class="banking-details">
                <div style="font-size:11px; font-weight:800; text-transform:uppercase; color:var(--primary); margin-bottom:15px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">
                    Electronic Transfer Instructions
                </div>
                <div class="bank-grid">
                    <div class="bank-item">
                        <label>Transfer Via</label><br>
                        <span id="out-mode"></span>
                    </div>
                    <div class="bank-item">
                        <label>Swift / BIC Code</label><br>
                        <span id="out-swift"></span>
                    </div>
                    <div class="bank-item" style="grid-column: span 2;">
                        <label>Account IBAN (UBL Pakistan)</label><br>
                        <span id="out-iban" style="font-family: monospace; letter-spacing:1px; background:white; padding:2px 5px;"></span>
                    </div>
                    <div class="bank-item" style="grid-column: span 2;">
                        <label>Bank Address</label><br>
                        <span id="out-bank-addr"></span>
                    </div>
                </div>
            </div>

            <div id="out-footer"></div>
        </div>
    </div>

    <script>
        function update() {
            // Text Inputs
            document.getElementById('out-client-name').innerText = document.getElementById('in-client-name').value;
            document.getElementById('out-client-details').innerText = document.getElementById('in-client-details').value;
            document.getElementById('out-project-desc').innerText = document.getElementById('in-project').value;
            document.getElementById('out-price').innerText = document.getElementById('in-price').value;
            document.getElementById('out-total').innerText = document.getElementById('in-price').value;
            
            // Banking
            document.getElementById('out-mode').innerText = document.getElementById('in-mode').value;
            document.getElementById('out-iban').innerText = document.getElementById('in-iban').value;
            document.getElementById('out-swift').innerText = document.getElementById('in-swift').value;
            document.getElementById('out-bank-addr').innerText = document.getElementById('in-bank-addr').value;

            // Optional Deadline
            const deadValue = document.getElementById('in-deadline').value;
            if(deadValue) {
                document.getElementById('deadline-box').style.display = 'block';
                document.getElementById('out-deadline').innerText = deadValue;
            } else {
                document.getElementById('deadline-box').style.display = 'none';
            }

            // Footer
            document.getElementById('out-footer').innerText = document.getElementById('in-footer-text').value;
        }

        function applyPreset() {
            const preset = document.getElementById('footer-presets').value;
            if(preset) {
                document.getElementById('in-footer-text').value = preset;
                update();
            }
        }

        // Auto-date
        document.getElementById('out-date').innerText = new Date().toLocaleDateString('en-US', { 
            year: 'numeric', month: 'long', day: 'numeric' 
        });

        // Logo Upload
        document.getElementById('logoInput').onchange = function (e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = (event) => document.getElementById('display-logo').src = event.target.result;
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        // Initialize
        update();
    </script>
</body>
</html>
